[workspace]
resolver = "2"
members = [
    "crates/crysirror-codec-omv",
    "crates/crysirror-codec-amv",
    "crates/crysirror-codec-theora",
    "crates/crysirror-codec-mpeg",
    "crates/crysirror-codec-wmv",
    "crates/crysirror-codec-emote",

    "crates/crysirror-io",
    "crates/crysirror-tasks",
    "crates/crysirror-vfx",
    "crates/crysirror-core",
    "crates/crysirror-compat",
    "crates/crysirror-host",
    "crates/crysirror-cli",
    "crates/crysirror-runtime",
    "crates/crysirror-wgpu",
    "crates/crysirror-desktop",
    "crates/crysirror-mobile",
    "crates/crysirror-console",
    "crates/crysirror-shader-tools",
    "crates/crysirror-shaders",
    "crates/crysirror-raytrace",
    "crates/crysirror-web",
    "crates/crysirror-author",
    "crates/crysirror-image",
    "crates/crysirror-resource",
    "crates/crysirror-network",
    "crates/crysirror-formats-arc",
    "crates/crysirror-formats-blackcyc",
    "crates/crysirror-physics",
    "crates/crysirror-siglus",
    "crates/crysirror-text",
    "crates/crysirror-text-legacy",
    "crates/crysirror-audio",
    "crates/crysirror-acoustics",
    "crates/crysirror-scene",
    "crates/crysirror-puppet",
    "crates/crysirror-puppet-eluna",
    "crates/crysirror-siglus-vm",
    "crates/crysirror-asset",
    "crates/crysirror-engine",
    "crates/crysirror-script-js",
    "crates/crysirror-ue-import",
    "crates/crysirror-video",
    "crates/crysirror-reallive",
    "crates/crysirror-avg32",
    "crates/crysirror-tjs2",
    "crates/crysirror-kag",
    "crates/crysirror-rfvp-vm",
    "crates/crysirror-krkr",
    "crates/crysirror-rfvp",
    "crates/crysirror-nscripter",
    "crates/crysirror-bgi-vm",
    "crates/crysirror-bgi",
    "crates/crysirror-bgi-integrated",
    "crates/crysirror-softpal",
    "crates/crysirror-softpal-kira",
    "crates/crysirror-circus",
    "crates/crysirror-catsystem2",
    "crates/crysirror-system4",
    "crates/crysirror-system-nnn",
    "crates/crysirror-majiro",
    "crates/crysirror-qlie",
    "crates/crysirror-reallive-dll",
]
exclude = [
    "vendor/sofar",
]
default-members = ["crates/crysirror-desktop"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MPL-2.0"
# Storage leases require Rust 1.89; the workspace is tested on 1.98.1.
rust-version = "1.95"

[workspace.dependencies]
crysirror-qlie = { path = "crates/crysirror-qlie" }
crysirror-network = { path = "crates/crysirror-network" }
crysirror-io = { path = "crates/crysirror-io" }
crysirror-tasks = { path = "crates/crysirror-tasks" }
crysirror-vfx = { path = "crates/crysirror-vfx" }
crysirror-core = { path = "crates/crysirror-core" }
crysirror-compat = { path = "crates/crysirror-compat" }
crysirror-host = { path = "crates/crysirror-host" }
crysirror-runtime = { path = "crates/crysirror-runtime" }
crysirror-wgpu = { path = "crates/crysirror-wgpu" }
crysirror-image = { path = "crates/crysirror-image" }
crysirror-resource = { path = "crates/crysirror-resource" }
crysirror-formats-arc = { path = "crates/crysirror-formats-arc" }
crysirror-formats-blackcyc = { path = "crates/crysirror-formats-blackcyc" }
crysirror-system-nnn = { path = "crates/crysirror-system-nnn" }
crysirror-physics = { path = "crates/crysirror-physics" }
crysirror-siglus = { path = "crates/crysirror-siglus" }
crysirror-text = { path = "crates/crysirror-text" }
crysirror-text-legacy = { path = "crates/crysirror-text-legacy" }
crysirror-audio = { path = "crates/crysirror-audio" }
crysirror-acoustics = { path = "crates/crysirror-acoustics" }
crysirror-scene = { path = "crates/crysirror-scene" }
crysirror-puppet = { path = "crates/crysirror-puppet" }
crysirror-puppet-eluna = { path = "crates/crysirror-puppet-eluna" }
crysirror-siglus-vm = { path = "crates/crysirror-siglus-vm" }
crysirror-asset = { path = "crates/crysirror-asset" }
crysirror-engine = { path = "crates/crysirror-engine" }
crysirror-script-js = { path = "crates/crysirror-script-js" }
crysirror-reallive = { path = "crates/crysirror-reallive" }
crysirror-rfvp = { path = "crates/crysirror-rfvp" }
crysirror-nscripter = { path = "crates/crysirror-nscripter" }
crysirror-bgi-vm = { path = "crates/crysirror-bgi-vm" }
crysirror-bgi = { path = "crates/crysirror-bgi" }
crysirror-bgi-integrated = { path = "crates/crysirror-bgi-integrated" }
crysirror-softpal = { path = "crates/crysirror-softpal" }
crysirror-circus = { path = "crates/crysirror-circus" }
crysirror-catsystem2 = { path = "crates/crysirror-catsystem2" }
crysirror-majiro = { path = "crates/crysirror-majiro" }
crysirror-reallive-dll = { path = "crates/crysirror-reallive-dll" }
crysirror-avg32 = { path = "crates/crysirror-avg32" }
crysirror-krkr = { path = "crates/crysirror-krkr" }
crysirror-tjs2 = { path = "crates/crysirror-tjs2" }
crysirror-kag = { path = "crates/crysirror-kag" }
crysirror-rfvp-vm = { path = "crates/crysirror-rfvp-vm", default-features = false, features = ["no_std"] }
crysirror-author = { path = "crates/crysirror-author" }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
anyhow = "1.0"
# Deliberately pinned API generations, compiled in this desktop iteration.
wgpu = { version = "=29.0.3", features = ["wgsl"] }
winit = "=0.30.12"
pollster = "0.3"
bytemuck = { version = "1.16", features = ["derive"] }
glam = "0.27"
ab_glyph = "0.2.29"
image = { version = "0.24.9", default-features = false, features = ["png", "jpeg", "bmp", "hdr", "dds", "tga", "webp", "gif", "tiff", "pnm", "ico"] }
blake3 = "1.5"
cap-std = "3.4"

# Local debug artifacts previously exceeded 300 GiB. Keep development builds
# disposable and use release for validation/benchmarks (owner preference).
# Plain `cargo build` must be a playable player: an unoptimized binary was too
# slow to decode opening movies, so dev is optimized without runtime checks.
[profile.dev]
debug = 0
incremental = false
opt-level = 2
debug-assertions = false
overflow-checks = false

[profile.test]
debug = 0
incremental = false
opt-level = 0
debug-assertions = true
overflow-checks = true

[profile.release]
lto = "thin"
codegen-units = 1

# Pinned standalone SOFA/DSP dependency with the audited HDF5-v3 parser fix.
[patch.crates-io]
sofar = { path = "vendor/sofar" }
