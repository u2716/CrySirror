name: CrySirror
options:
  bundleIdPrefix: org.crysirror
  deploymentTarget:
    macOS: '13.0'
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_OBJC_BRIDGING_HEADER: Bridge.h
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGNING_ALLOWED: NO
targets:
  CrySirror-macOS:
    type: application
    platform: macOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_NAME: CrySirror
        PRODUCT_BUNDLE_IDENTIFIER: org.crysirror.player
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CrySirror
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LIBRARY_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Vendor'
        LD_RUNPATH_SEARCH_PATHS: '$(inherited) @executable_path/../Frameworks'
    dependencies:
      - framework: Vendor/libcrysirror_mobile.dylib
        embed: true
        codeSign: false
  CrySirror-iOS:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_NAME: CrySirror
        PRODUCT_BUNDLE_IDENTIFIER: org.crysirror.player
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: CrySirror
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - framework: Vendor/CrySirror.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: AVFoundation.framework
      - sdk: AudioToolbox.framework
      - sdk: CoreAudio.framework
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: libc++.tbd
