name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Link the full player, with a smaller CI build footprint than production LTO.
  CARGO_PROFILE_RELEASE_DEBUG: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            cargo_jobs: 4
          - os: windows-2022
            platform: windows
            cargo_jobs: 4
          - os: macos-latest
            platform: macos
            cargo_jobs: 2
    env:
      CARGO_BUILD_JOBS: ${{ matrix.cargo_jobs }}
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: crysirror-release-v1-${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use a short Windows build path
        if: runner.os == 'Windows'
        run: echo "CARGO_TARGET_DIR=C:/t" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            pkg-config libasound2-dev libudev-dev libxkbcommon-dev \
            libwayland-dev libx11-dev libxi-dev libxcursor-dev \
            libxrandr-dev libxinerama-dev

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustc +stable --version
          cargo +stable --version

      - name: Cache dependency sources
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-downloads-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-downloads-v2-${{ runner.os }}-${{ runner.arch }}-

      - name: Cache Rust compilation results
        id: sccache
        # The Windows wrapper fails with CreateProcess error 206 on this
        # dependency graph. Use direct rustc and the short target path there.
        if: runner.os != 'Windows'
        continue-on-error: true
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: v0.19.0
          # Its post action assumes installation succeeded. Collect stats below
          # only after the wrapper was actually enabled.
          disable_annotations: true

      - name: Enable available compiler cache
        if: steps.sccache.outcome == 'success'
        run: |
          if sccache --version && sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "::warning::Compiler cache unavailable; building directly with rustc"
          fi

      - name: Build release player
        run: cargo +stable build --release --locked --timings -p crysirror-desktop --bin crysirror

      - name: Package release player
        run: |
          binary="${CARGO_TARGET_DIR:-target}/release/crysirror"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python3 tools/ci_package.py desktop --binary "$binary" --platform "${{ matrix.platform }}"

      - name: Upload release player
        uses: actions/upload-artifact@v7
        with:
          name: crysirror-${{ matrix.platform }}-${{ runner.arch }}
          path: dist/crysirror-*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Report compiler cache statistics
        if: ${{ always() && env.RUSTC_WRAPPER == 'sccache' }}
        continue-on-error: true
        run: sccache --show-stats

      - name: Upload build timings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-${{ matrix.os }}-${{ runner.arch }}
          path: ${{ env.CARGO_TARGET_DIR || 'target' }}/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 3

  # Browser host (crates/crysirror-web): threaded wasm32 build with
  # shared-memory Workers, bindings from the wasm-bindgen release pinned in
  # Cargo.lock. The artifact is the static site served by tools/web_host.py.
  web:
    name: Web (wasm32)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CRYSIRROR_NIGHTLY: nightly-2026-09-17
      SCCACHE_GHA_ENABLED: 'true'
      SCCACHE_GHA_VERSION: crysirror-web-v1
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$CRYSIRROR_NIGHTLY" --profile minimal \
            --component rust-src --target wasm32-unknown-unknown
          rustc +"$CRYSIRROR_NIGHTLY" --version

      - name: Cache dependency sources
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/wasm-tools
          key: cargo-downloads-v2-web-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-v2-web-

      - name: Install wasm-bindgen matching Cargo.lock
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/version = |"/, ""); print; exit}' Cargo.lock)
          root="target/wasm-tools/wasm-bindgen-$version-cli"
          if [ ! -x "$root/wasm-bindgen" ]; then
            cargo install wasm-bindgen-cli --version "$version" --locked --root "$root/install"
            cp "$root/install/bin/wasm-bindgen" "$root/wasm-bindgen"
          fi
          "$root/wasm-bindgen" --version

      - name: Build browser host
        run: python3 tools/web_host.py build

      - name: Package browser host
        run: python3 tools/ci_package.py web

      - name: Upload site
        uses: actions/upload-artifact@v7
        with:
          name: crysirror-web
          path: dist/crysirror-web.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  psv_image:
    name: PS Vita build image
    uses: ./.github/workflows/console-image.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: psv

  # CrySirror's own VitaSDK/libvita2d/cargo-vita image, keyed by Dockerfile.
  # GXP programs are committed; no proprietary compiler module is required.
  psv:
    name: PS Vita (VPK)
    needs: psv_image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.psv_image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      VITASDK: /usr/local/vitasdk
      CRYSIRROR_NIGHTLY: nightly-2026-09-17
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Report build tools
        run: |
          rustc +"$CRYSIRROR_NIGHTLY" --version
          "$VITASDK/bin/arm-vita-eabi-gcc" --version
          cargo +"$CRYSIRROR_NIGHTLY" vita --version

      - name: Cache dependency sources
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: cargo-downloads-v2-psv-${{ hashFiles('platform/psv/player/Cargo.lock') }}
          restore-keys: cargo-downloads-v2-psv-

      - name: Build VPK
        working-directory: platform/psv/player
        run: cargo +"$CRYSIRROR_NIGHTLY" vita build vpk -- --release

      - name: Stage VPK
        run: python3 tools/ci_package.py console --platform psv --input platform/psv/player/target/armv7-sony-vita-newlibeabihf/release

      - name: Upload VPK
        uses: actions/upload-artifact@v7
        with:
          name: crysirror-psv
          path: dist/crysirror-psv.vpk
          if-no-files-found: error
          retention-days: 1

  switch_image:
    name: Nintendo Switch build image
    uses: ./.github/workflows/console-image.yml
    permissions:
      contents: read
      packages: write
    with:
      platform: switch

  # CrySirror's own devkitA64/libnx/deko3d/uam image. The Makefile retains
  # CrySirror's std/libc layout patches and shared shader build.
  switch:
    name: Nintendo Switch (NRO)
    needs: switch_image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.switch_image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      TOOLCHAIN: nightly-2026-09-17
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Prepare host toolchain before parallel build
        run: |
          # Match rust-toolchain.toml before make starts concurrent host tools.
          # Otherwise each cargo invocation tries to install the same components.
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustc +stable --version
          rustc +"$TOOLCHAIN" --version
          "$DEVKITA64/bin/aarch64-none-elf-gcc" --version

      - name: Cache dependency downloads
        continue-on-error: true
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /usr/local/cargo/git/db
          key: cargo-downloads-v2-switch-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-downloads-v2-switch-

      - name: Build NRO
        working-directory: platform/switch/runtime
        run: make TOOLCHAIN="$TOOLCHAIN" -j"$(nproc)"

      - name: Stage NRO
        run: python3 tools/ci_package.py console --platform switch --input platform/switch/runtime/crysirror.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v7
        with:
          name: crysirror-switch
          path: dist/crysirror-switch.nro
          if-no-files-found: error
          retention-days: 1

  prerelease:
    name: Publish rolling pre-release
    needs: [desktop, web, psv, switch]
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          pattern: crysirror-*
          path: release-assets
          merge-multiple: true

      - name: Prepare release metadata and checksums
        run: |
          python3 - <<'PY'
          import json, os, tomllib
          from pathlib import Path
          root = Path('release-assets')
          expected = ['crysirror-linux-x86_64.tar.gz', 'crysirror-windows-x86_64.zip',
                      'crysirror-macos-arm64.tar.gz', 'crysirror-web.zip',
                      'crysirror-psv.vpk', 'crysirror-switch.nro']
          for name in expected:
              if not (root / name).is_file():
                  raise SystemExit(f'Missing build package: {name}')
          info = {'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                  'version': tomllib.loads(Path('Cargo.toml').read_text())['workspace']['package']['version']}
          (root / 'build.json').write_text(json.dumps(info, indent=2) + '\n')
          for name in ['LICENSE', 'NOTICE.md']:
              (root / name).write_bytes(Path(name).read_bytes())
          notes = [f"Rolling pre-release from `{info['commit']}`.", '',
                   'Only the latest successful build is retained on this page.', '',
                   '| Platform | Download |', '| --- | --- |']
          labels = ['Linux x86_64', 'Windows x86_64', 'macOS arm64 CLI', 'Web', 'PS Vita', 'Nintendo Switch']
          for label, name in zip(labels, expected):
              notes.append(f'| {label} | [{name}](https://github.com/{os.environ["GITHUB_REPOSITORY"]}/releases/download/pre-release/{name}) |')
          notes += ['', 'Verify downloads with `SHA256SUMS`. No game data or fonts are bundled.',
                    'These are pre-release builds. Compilation does not establish game or hardware compatibility.',
                    'The macOS CLI is not notarized. Android and iOS packages are not included in this build matrix.']
          Path('release-notes.md').write_text('\n'.join(notes) + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f"RELEASE_VERSION={info['version']}\n")
          PY
          python3 tools/ci_package.py checksums release-assets

      - name: Replace the rolling pre-release
        run: |
          set -euo pipefail
          # Build/validate every package before replacing this one rolling tag.
          # Other release tags and assets are never removed.
          if gh release view pre-release >/dev/null 2>&1; then
            gh release delete pre-release --cleanup-tag --yes
          elif gh api "repos/$GH_REPO/git/ref/tags/pre-release" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GH_REPO/git/refs/tags/pre-release"
          fi
          gh release create pre-release release-assets/* \
            --target "$GITHUB_SHA" --draft --prerelease --latest=false \
            --title "CrySirror v$RELEASE_VERSION pre-release (${GITHUB_SHA::7})" \
            --notes-file release-notes.md
          gh release edit pre-release --draft=false --prerelease --latest=false

      - name: Remove transferred build artifacts
        continue-on-error: true
        run: |
          gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate \
            --jq '.artifacts[] | select(.name | startswith("crysirror-")) | .id' |
          while read -r id; do
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done

      - name: Prune obsolete dependency and Docker caches
        continue-on-error: true
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 tools/ci_cache.py --repo "$GH_REPO" --default-branch "$DEFAULT_BRANCH" --prune
