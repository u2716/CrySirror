name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Rust and targets
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add aarch64-linux-android
          # Optional: add x86_64 if you need emulator support
          # rustup target add x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/registry/src
            ~/.cargo/git/db
            ~/.cargo/git/checkouts
          key: cargo-sources-android-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-sources-android-

      - name: Build Android package
        run: |
          python3 tools/package_platform.py android

      - name: Sign APK with debug key
        run: |
          # 1. Generate a throwaway debug keystore
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # 2. Find the latest build-tools
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)"

          # 3. Zipalign
          UNSIGNED_APK="platform/android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="platform/android/app/build/outputs/apk/release/app-release-aligned.apk"
          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"

          # 4. Sign with debug key
          SIGNED_APK="platform/android/app/build/outputs/apk/release/app-release-signed.apk"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$RUNNER_TEMP/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          # 5. Verify
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$SIGNED_APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: CrySirror-Android-APK
          path: platform/android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error
          retention-days: 7
