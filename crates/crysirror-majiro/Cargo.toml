[package]
name = "crysirror-majiro"
version.workspace = true
edition.workspace = true
license = "MIT"
rust-version.workspace = true
publish = false
description = "First-class Majiro original bytecode and thin engine adapter"
[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
crysirror-core.workspace = true
crysirror-resource.workspace = true
crysirror-tasks.workspace = true
crysirror-vfx = {workspace=true,optional=true}
crysirror-runtime = { workspace = true, optional = true }
encoding_rs = "0.8"
crysirror-text-legacy.workspace = true
crysirror-image = { workspace = true, optional = true }
crysirror-formats-arc = { workspace = true, optional = true }
[features]
runtime = ["dep:crysirror-runtime", "dep:crysirror-vfx", "dep:crysirror-image", "dep:crysirror-formats-arc"]
[dev-dependencies]
crysirror-formats-arc.workspace = true
tempfile = "3"
