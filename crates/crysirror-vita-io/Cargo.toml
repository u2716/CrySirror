[package]
name = "crysirror-vita-io"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "64-bit read-only file access on PS Vita (Rust std's newlib backend has a 32-bit off_t there)"

[target.'cfg(target_os = "vita")'.dependencies]
vitasdk-sys = { version = "=0.3.3", default-features = false, features = ["SceLibKernel_stub", "SceIofilemgr_stub"] }
