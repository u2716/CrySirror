[package]
name = "crysirror-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
arc-formats = ["dep:crysirror-formats-arc"]
blackcyc-formats = ["dep:crysirror-formats-blackcyc"]

[dependencies]
crysirror-tasks.workspace = true
crysirror-vfx.workspace = true
crysirror-audio.workspace = true
crysirror-core.workspace = true
crysirror-scene.workspace = true
crysirror-puppet.workspace = true
crysirror-physics.workspace = true
crysirror-asset.workspace = true
glam.workspace = true
crysirror-image.workspace = true
crysirror-resource.workspace = true
crysirror-formats-arc = { workspace = true, optional = true }
crysirror-formats-blackcyc = { workspace = true, optional = true }
crysirror-text.workspace = true
encoding_rs = "0.8"
crysirror-video = { path = "../crysirror-video" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
toml_edit = { version = "=0.25.17", default-features = false, features = ["parse"] }
blake3.workspace = true
chrono = "=0.4.45"
getrandom = "=0.3.4"
web-time = "1"

[dev-dependencies]
crysirror-acoustics.workspace = true
tempfile = "3.12"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crysirror-network = { path = "../crysirror-network", default-features = false, features = ["http"] }
cap-std.workspace = true
crysirror-siglus-vm.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "=0.3.4", features = ["wasm_js"] }
