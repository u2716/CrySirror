[package]
name = "crysirror-wgpu"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
crysirror-shaders = { path = "../crysirror-shaders" }
crysirror-vfx.workspace = true
crysirror-tasks.workspace = true
crysirror-core.workspace = true
crysirror-image.workspace = true
crysirror-scene.workspace = true
crysirror-puppet.workspace = true
crysirror-runtime.workspace = true
wgpu.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
blake3.workspace = true
glam.workspace = true
crysirror-text.workspace = true
image.workspace = true
crysirror-asset.workspace = true
half = { version = "2", features = ["bytemuck"] }
serde_json.workspace = true
serde.workspace = true

naga = { version = "=29.0.3", features = ["wgsl-in"] }
pollster.workspace = true

[dev-dependencies]
futures = "=0.3.34"
tempfile = "3.12"
crysirror-siglus.workspace = true
crysirror-siglus-vm.workspace = true
crysirror-scene.workspace = true

# Browser GPU objects stay on the owning dedicated worker. This upstream
# feature implements Send/Sync only for wasm builds without shared atomics.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["fragile-send-sync-non-atomic-wasm"] }
