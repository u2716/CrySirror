[package]
name = "crysirror-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
threads = ["crysirror-tasks/web-threads", "dep:wasm-bindgen-rayon", "dep:rayon"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crysirror-core.workspace = true
crysirror-runtime.workspace = true
crysirror-wgpu.workspace = true
crysirror-tasks.workspace = true
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
crysirror-audio.workspace = true
web-time = "1"
rayon = { version = "=1.12.0", optional = true }
wasm-bindgen-rayon = { version = "=1.3.0", features = ["no-bundler"], optional = true }
gloo-timers = { version = "0.3", features = ["futures"] }
wgpu.workspace = true
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = { version = "=0.3.106", features = ["OffscreenCanvas"] }
